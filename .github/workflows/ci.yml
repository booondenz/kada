name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the patch release, not the minor line. The go directive in go.mod is a patch-level floor
  # (go 1.26.10), and setup-go installs GOTOOLCHAIN=local, so Go will not fetch a newer toolchain to
  # satisfy it: asking for "1.26" got this runner's cached 1.26.9 and every job that loads the module
  # stopped before it built. Raise this whenever go.mod's directive moves up.
  GO_VERSION: "1.26.10"
  NODE_VERSION: "22"

jobs:
  # ----- Go lint -----
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # The Go module is the repository root, so the cache key hashes the root go.sum.
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  # ----- Go tests -----
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kada
          POSTGRES_PASSWORD: kada123
          POSTGRES_DB: kada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # The Go module is the repository root, so the cache key hashes the root go.sum.
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        env:
          DATABASE_URL: postgres://kada:kada123@localhost:5432/kada_test?sslmode=disable
          JWT_SECRET: test-secret
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  # ----- Web lint -----
  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

  # ----- Web build -----
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        env:
          # "same-origin" makes the bundle issue relative requests: nginx serves the frontend and proxies
          # /api/ to the Go backend. The sentinel is used instead of an empty value because the bundler
          # replaces import.meta.env.VITE_API_URL at build time, so it has to be set here - see the note in src/lib/api.ts.
          VITE_API_URL: "same-origin"
        run: npm run build

      # Packed here rather than in the deploy job, so the deploy job gets the bundle instead of building
      # the same commit a second time. The bundle is plain files: nginx serves them from a directory.
      - name: Package the web app for the host
        working-directory: web
        run: |
          mkdir -p ../deploy-pkg
          tar czf ../deploy-pkg/kada-fe.tar.gz -C dist .

      - name: Upload the frontend build
        uses: actions/upload-artifact@v7
        with:
          name: web-deploy-pkg
          path: deploy-pkg
          retention-days: 1

  # ----- Deploy to production -----
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [go-lint, go-test, web-lint, web-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # The Go module is the repository root, so the cache key hashes the root go.sum.
          cache-dependency-path: go.sum

      - name: Build Go binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/server ./cmd/server/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/migrate ./cmd/migrate/

      # Built by the web-build job - same commit, same VITE_API_URL - and handed over as one
      # artifact. Setting up Node and running `npm ci && npm run build` here again cost ~35s of the deploy
      # for a bundle that was already sitting in the workspace next door.
      - name: Fetch the web build
        uses: actions/download-artifact@v7
        with:
          name: web-deploy-pkg
          path: deploy-pkg

      - name: Create deploy marker
        run: |
          echo "${{ github.sha }}" > deploy-version.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deploy-version.txt

      # One tarball, one stream, and a transfer that ends.
      #
      # This step was `appleboy/scp-action` with six sources, one of them a directory glob. Two runs in
      # September 2026 spent 8 and 27 minutes in it while the runs either side took 26s: the duration is
      # whatever the runner-to-host link decides that day, and the action's own command timeout (10m by
      # default, see its action.yml) did not bound the 27-minute case. The bundle is now tarred here and
      # pushed as a single stream under a per-attempt timeout, three attempts and a size check, so a bad
      # link costs minutes and fails while the host is still untouched - instead of holding the run open
      # until the transfer happens to complete.
      - name: Upload the deploy bundle
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          # The key arrives as a secret, so it is written to a file with the permissions ssh insists on.
          # The trailing newline is on purpose: a key without one is rejected as malformed.
          KEY="$RUNNER_TEMP/kada_deploy_key"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"

          # The host key is not pinned in this repository, which is what the action this replaces did too
          # (its `fingerprint` input defaults to skipping verification). accept-new records it on first
          # use, so the connections below are checked against that record rather than against nothing.
          SSH=(ssh -i "$KEY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
               -o UserKnownHostsFile="$RUNNER_TEMP/kada_known_hosts" -o ConnectTimeout=15
               -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          REMOTE="$SERVER_USER@$SERVER_HOST"
          BUNDLE="$RUNNER_TEMP/kada-deploy.tar.gz"

          # The file list doubles as an assertion: tar fails on a missing member, which is how a web
          # artifact that never arrived stops the deploy here rather than on the host.
          tar czf "$BUNDLE" \
            bin/server bin/migrate \
            deploy-pkg deploy-version.txt \
            deploy/upsert-env.sh deploy/nginx/nginx-prod.conf

          local_size=$(stat -c%s "$BUNDLE")
          echo "the deploy bundle is $local_size bytes"

          # The test harness sets this to 0 so a case does not wait out the backoff.
          RETRY_DELAY_SECONDS="${RETRY_DELAY_SECONDS:-15}"

          uploaded=no
          for attempt in 1 2 3; do
            echo "upload attempt $attempt of 3"
            # A stalled connection is the failure this exists for: `timeout` ends it, and the size check
            # below catches the other one - ssh exiting 0 after delivering part of the bundle.
            if timeout 300 "${SSH[@]}" "$REMOTE" 'cat > /tmp/kada-deploy.tar.gz' < "$BUNDLE"; then
              remote_size=$("${SSH[@]}" "$REMOTE" 'stat -c%s /tmp/kada-deploy.tar.gz')
              if [ "$remote_size" = "$local_size" ]; then uploaded=yes; break; fi
              echo "the host holds $remote_size of $local_size bytes"
            else
              # The size is asked for here too, not only on success. "did not finish" on its own cannot tell a
              # link that delivered nothing from one that delivered all but the last megabyte, and those two
              # want opposite answers: a longer timeout for the second, another route for the first. Bounded,
              # because this runs on a link that has just proved it can stall.
              partial=$(timeout 30 "${SSH[@]}" "$REMOTE" 'stat -c%s /tmp/kada-deploy.tar.gz 2>/dev/null || echo 0' || echo unknown)
              echo "attempt $attempt did not finish, the host holds $partial of $local_size bytes"
            fi
            sleep "$RETRY_DELAY_SECONDS"
          done

          if [ "$uploaded" != yes ]; then
            echo "the bundle did not reach the host in three attempts; nothing on the host was changed"
            exit 1
          fi

          # Unpacked here, so the step below starts from a complete tree under the directory it already
          # expects, and so a failed transfer cannot leave a half-written one there.
          "${SSH[@]}" "$REMOTE" \
            'rm -rf /tmp/kada-deploy && mkdir -p /tmp/kada-deploy && tar xzf /tmp/kada-deploy.tar.gz -C /tmp/kada-deploy && rm -f /tmp/kada-deploy.tar.gz'
          echo "the bundle is unpacked on the host"

      # The id is what the report step below reads to tell "the site was not reachable" apart from "the
      # release never reached the host": without it, a failed deploy is reported as a smoke test that did
      # not run, next to a reassuring sentence about a deployment that never happened.
      - name: Apply schema and restart services
        id: apply
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The operator secret lives here rather than in a file someone edits over SSH; see
          # deploy/upsert-env.sh for how it is written.
          #
          # Add it under Settings -> Secrets and variables -> Actions:
          #   ADMIN_SECRET          the operator secret the console asks for (optional)
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          # Optional, and not required below: moderation can wait, and a deployment that refused to run
          # because the operator's secret was not set would be a deployment held hostage by a feature it
          # does not need. Empty means the host file keeps whatever it already holds, and an empty secret
          # in the service refuses everybody.
          # The public origin, so the check below can ask this host's nginx for the site without DNS.
          # Same variable and same default as the runner-side verification further down.
          SITE_ORIGIN: ${{ vars.SITE_URL || 'https://kada.click' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # The step replaces the API and the frontend and then waits for the API to answer; the action
          # default of 10m is generous for that, and the whole step finishes in well under a minute.
          command_timeout: 10m
          envs: DATABASE_URL,ADMIN_SECRET,SITE_ORIGIN
          script: |
            set -euo pipefail

            DEPLOY_DIR=/tmp/kada-deploy
            BACKEND_DIR=/opt/kada/backend
            FRONTEND_DIR=/opt/kada/frontend
            # The file the nginx container has bind-mounted as its /etc/nginx/nginx.conf.
            NGINX_CONF=/opt/kada/nginx-prod.conf

            echo "Deploying $(head -1 "$DEPLOY_DIR/deploy-version.txt")"

            # 0. Sync the secrets BEFORE touching anything on this host.
            #
            #    Placement is the whole point: a missing key must fail the deployment while every service
            #    is still running the previous, working build. Run this after step 3 and a forgotten
            #    secret would take the site down and only then say why.
            #
            #    --set with an empty value keeps whatever the file already holds, so a host configured by
            #    hand keeps working; --require is what makes "nothing there at all" a hard failure.
            echo "Syncing secrets into the runtime env files"
            #
            bash "$DEPLOY_DIR/deploy/upsert-env.sh" "$BACKEND_DIR/.env" \
              --set "ADMIN_SECRET=$ADMIN_SECRET"

            # 1. Back up the running binary so a failed start can be rolled back.
            echo "Backing up the current binary"
            mkdir -p "$BACKEND_DIR/backups"
            cp "$BACKEND_DIR/bin/server" "$BACKEND_DIR/backups/server.$(date +%Y%m%d%H%M%S)" 2>/dev/null || true
            ls -t "$BACKEND_DIR"/backups/server.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

            # 2. Apply the database schema.
            # The schema is defined by the GORM models in internal/domain/entity and applied by
            # cmd/migrate: it reconciles legacy constraint names, then runs AutoMigrate (additive only).
            #
            # DATABASE_URL comes from the repository secret when one is set, and otherwise from the host's
            # own .env. The empty case is unset rather than merely not set again: godotenv does not
            # override a variable that is present in the environment, and an exported empty string is
            # present - so a secret that exists but holds nothing would shadow the file and hand
            # cmd/migrate the built-in localhost default, against whatever happens to be listening there.
            # The step says which source it used, because "the schema was applied" is not something to
            # infer from a green run.
            echo "Applying the database schema"
            cp -f "$DEPLOY_DIR/bin/migrate" "$BACKEND_DIR/bin/migrate"
            chmod +x "$BACKEND_DIR/bin/migrate"
            cd "$BACKEND_DIR"
            # The target is printed without its credentials - scheme and user:password stripped - so the
            # log says which database the schema went to and can be compared with the host's .env. A
            # password never reaches a log.
            db_target() {
              printf '%s' "$1" | sed -E 's#^[a-zA-Z0-9+.-]+://##; s#^[^/]*@##; s#[?].*$##'
            }
            if [ -n "${DATABASE_URL:-}" ]; then
              echo "DATABASE_URL comes from the repository secret, and points at $(db_target "$DATABASE_URL")"
              DATABASE_URL="$DATABASE_URL" ./bin/migrate
            else
              echo "DATABASE_URL comes from $BACKEND_DIR/.env"
              unset DATABASE_URL
              ./bin/migrate
            fi

            # 3. Replace the backend binary.
            echo "Restarting the backend"
            systemctl stop kada-api
            cp "$DEPLOY_DIR/bin/server" "$BACKEND_DIR/bin/server"
            chmod +x "$BACKEND_DIR/bin/server"
            systemctl start kada-api
            sleep 2

            if ! systemctl is-active --quiet kada-api; then
              echo "kada-api failed to start, rolling back"
              cp "$BACKEND_DIR"/backups/server.* "$BACKEND_DIR/bin/server" 2>/dev/null || true
              systemctl start kada-api || true
              exit 1
            fi
            echo "kada-api is running"

            # 4. Replace the frontend build.
            #
            #    Static files, so there is no service to restart and no runtime to supervise: nginx serves
            #    this directory directly (see deploy/nginx/nginx-prod.conf).
            #
            #    The bundle is moved INTO the directory rather than replacing it, because that directory
            #    is bind-mounted into the nginx container and a bind mount keeps the inode it resolved
            #    when the container started. `rm -rf` + `mv` here left nginx serving the removed, now
            #    empty directory, and the try_files fallback turned that into a 500 on every page - while
            #    the API, behind its own location blocks, kept answering 200 and every check passed.
            #
            #    Moving in is still atomic where it matters. Vite names its bundles by content hash, so a
            #    new build never reuses one and no visitor can be holding an old name; the only reused
            #    name is index.html, and that one is renamed into place. Bundle files the new build does
            #    not contain are deleted afterwards, once nothing references them.
            echo "Deploying the frontend"
            rm -rf "$FRONTEND_DIR.new"
            mkdir -p "$FRONTEND_DIR" "$FRONTEND_DIR.new"
            tar xzf "$DEPLOY_DIR/deploy-pkg/kada-fe.tar.gz" -C "$FRONTEND_DIR.new"

            cp -a "$FRONTEND_DIR.new/." "$FRONTEND_DIR/"
            cp -a "$FRONTEND_DIR.new/index.html" "$FRONTEND_DIR/.index.html.new"
            mv -f "$FRONTEND_DIR/.index.html.new" "$FRONTEND_DIR/index.html"

            (cd "$FRONTEND_DIR.new" && find . -type f -printf '%P\n' | sort) > "$DEPLOY_DIR/frontend-wanted"
            (cd "$FRONTEND_DIR" && find . -type f -printf '%P\n' | sort) > "$DEPLOY_DIR/frontend-present"
            comm -13 "$DEPLOY_DIR/frontend-wanted" "$DEPLOY_DIR/frontend-present" > "$DEPLOY_DIR/frontend-stale"
            while IFS= read -r stale; do
              rm -f "$FRONTEND_DIR/$stale"
            done < "$DEPLOY_DIR/frontend-stale"

            rm -rf "$FRONTEND_DIR.new"
            echo "the frontend is deployed"

            # 5. Replace the nginx configuration.
            #
            #    /opt/kada/nginx-prod.conf is bind-mounted as the container's /etc/nginx/nginx.conf, and a
            #    FILE bind mount keeps the inode it resolved when the container started - the same trap as
            #    the frontend directory, one level down. Replacing the file (mv, or rm followed by cp)
            #    would leave the container reading the old inode: the deploy would report success, `nginx
            #    -t` would validate the old file, and nothing would have changed. The new content is
            #    therefore written INTO the existing file, never over it, and the hash check below is what
            #    proves the container is reading what was deployed.
            #
            #    The previous file is backed up and the change printed as a diff first, so an edit made on
            #    the host by hand is visible in the log rather than silently overwritten. `nginx -t` is the
            #    gate: a configuration nginx refuses is restored in place and fails the deploy, while the
            #    site keeps serving the previous one.
            echo "Deploying the nginx configuration"
            shipped="$DEPLOY_DIR/deploy/nginx/nginx-prod.conf"
            if [ ! -f "$shipped" ]; then
              echo "the bundle does not carry $shipped"
              exit 1
            fi
            if [ ! -w "$NGINX_CONF" ] && [ ! -w "$(dirname "$NGINX_CONF")" ]; then
              # Named explicitly, because this step fails on a permission rather than on anything about the
              # release, and the reason has to be readable from the log alone.
              echo "cannot write $NGINX_CONF as $(id -un); that is the file the container has mounted"
              exit 1
            fi

            mkdir -p "$BACKEND_DIR/backups"
            previous="$BACKEND_DIR/backups/nginx-prod.conf.$(date +%Y%m%d%H%M%S)"
            cp -a "$NGINX_CONF" "$previous" 2>/dev/null || true

            if cmp -s "$shipped" "$NGINX_CONF"; then
              echo "the served configuration already matches the repository"
            else
              echo "the served configuration differs, and this is the change being deployed:"
              if [ -f "$previous" ]; then
                echo "the previous configuration is kept at $previous"
              fi
              diff -u "$NGINX_CONF" "$shipped" || true

              cat "$shipped" > "$NGINX_CONF"

              if ! docker exec kada-nginx nginx -t; then
                echo "the deployed configuration is not valid, restoring the previous one"
                if [ -f "$previous" ]; then
                  cat "$previous" > "$NGINX_CONF"
                  docker exec kada-nginx nginx -t || true
                fi
                exit 1
              fi

              docker exec kada-nginx nginx -s reload
              echo "the configuration is deployed and nginx has reloaded it"
            fi

            # What the container reads is what is being served. A write that replaced the inode would show
            # up here as a mismatch, because the mount would still resolve the file the container started
            # with - which is the whole reason the content is written in place above.
            if ! served=$(docker exec kada-nginx cat /etc/nginx/nginx.conf | sha256sum | awk '{print $1}'); then
              echo "the container could not be asked which configuration it is reading"
              exit 1
            fi
            wanted=$(sha256sum "$shipped" | awk '{print $1}')
            if [ "$served" != "$wanted" ]; then
              echo "the container is reading a different configuration than the one deployed"
              echo "  the container reads: $served"
              echo "  the bundle carried:  $wanted"
              exit 1
            fi
            echo "the container is serving the deployed configuration"

            # 6. Verify on the host itself. This is the authoritative check: it does not depend on DNS,
            #    TLS or the public network, only on the API answering and nginx serving. The public check
            #    further below runs on the runner and then proves DNS and TLS are fine too.
            echo "Checking the API on the host"
            if ! curl -sS --fail --max-time 10 http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'; then
              echo "the API is not answering on 127.0.0.1:8080"
              journalctl -u kada-api -n 30 --no-pager || true
              exit 1
            fi
            echo "API answered on the host"

            # The site, through nginx, on this host. The API answering says nothing about whether nginx
            # is serving the bundle that was just deployed: a missing bind mount, a stale one, or a config
            # that still proxies to a port nothing listens on all leave the API healthy while every page
            # is a 500. That is how a broken frontend survived a green deploy.
            #
            # --resolve sends the request to this host without involving DNS, which keeps this check as
            # authoritative as the API one: no third party can fail it. -L follows the port-80 redirect to
            # HTTPS, and -k is deliberate - a valid certificate is the runner-side smoke test's business,
            # while this check is about the files behind it.
            SITE_HOST="${SITE_ORIGIN#*://}"
            SITE_HOST="${SITE_HOST%%/*}"
            echo "Checking the site on the host"
            if ! curl -sSkL --fail --max-time 10 \
                 --resolve "$SITE_HOST:443:127.0.0.1" --resolve "$SITE_HOST:80:127.0.0.1" \
                 "$SITE_ORIGIN/" | grep -q 'id="root"'; then
              echo "nginx is not serving the deployed frontend at $SITE_ORIGIN"
              docker exec kada-nginx nginx -t || true
              docker exec kada-nginx ls -l "$FRONTEND_DIR" 2>&1 | head -5 || true
              exit 1
            fi
            echo "the site answered on the host"

            # A behaviour the configuration itself provides, so that "deployed and valid" is not the same
            # as "deployed and doing what it says": the port-80 server block answers 301 to HTTPS. A
            # configuration with valid syntax and no redirect now fails the deploy here rather than being
            # discovered by a visitor.
            if ! curl -sS -o /dev/null -w '%{http_code}' --resolve "$SITE_HOST:80:127.0.0.1" \
                 "http://$SITE_HOST/" | grep -q 301; then
              echo "the plain-HTTP entry point is not redirecting to HTTPS"
              exit 1
            fi
            echo "the plain-HTTP entry point redirected"

            # 7. Clean up.
            rm -rf "$DEPLOY_DIR"
            echo "Deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # A reachability smoke test from the runner, covering DNS, TLS and nginx as a visitor sees them.
      #
      # It does NOT decide whether the deployment failed. The authoritative check is the one that ran on
      # the host during the deploy step (curl http://127.0.0.1:8080/api/health): it depends on nothing but
      # the API answering. A runner reaching this host goes through an edge that is entitled to refuse
      # connections from a datacenter - it answered `Connection reset by peer` (curl 35) during a TLS
      # handshake even while the same URL returned 200 from elsewhere - and gating a deployment on a third
      # party's tolerance for our IP range is not a check, it is a coin flip.
      #
      # This step absorbs that refusal instead of letting curl raise it: `continue-on-error` stops it from
      # failing the run, but it does not stop a non-zero curl from being announced as an error annotation
      # with a red X next to a deployment that in fact succeeded. A refusal is a fact to record, not an
      # error to raise, so the result is written to files and reported by the step below either way.
      - name: Verify deployment
        id: verify
        continue-on-error: true
        env:
          # The public origin is not a secret: it is in the certificate transparency logs, the DNS records
          # and deploy/nginx/nginx-prod.conf, which is where this default comes from. Override the SITE_URL
          # repository variable when a deployment serves a different name.
          SITE_ORIGIN: ${{ vars.SITE_URL || 'https://kada.click' }}
        run: |
          # Accept a bare hostname too, so "kada.click" fails on the network instead of reporting
          # `Protocol "kada.click" not supported`. Strip trailing slashes so "$BASE/api/health" stays sound.
          case "$SITE_ORIGIN" in
            http://* | https://*) BASE="$SITE_ORIGIN" ;;
            *) BASE="https://$SITE_ORIGIN" ;;
          esac
          BASE="${BASE%/}"

          # An empty host makes "https:///api/health", which curl reports as an unresolvable host called
          # "api" - a message that sends the reader looking in the wrong place.
          case "$BASE" in
            https:// | http://)
              echo "failed" > verify-status.txt
              echo "SITE_ORIGIN is empty; set the SITE_URL repository variable" > verify-body.txt
              echo "SITE_ORIGIN is empty; set the SITE_URL repository variable" >&2
              exit 0 ;;
          esac

          echo "$BASE" > verify-origin.txt

          # Retry: a refusal here is often a dropped connection rather than an unreachable site.
          CURL=(curl -sS --location --fail --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors)

          echo "Verifying $BASE"
          sleep 3

          # Any failure in here is captured, not raised: the reason is written to verify-body.txt and the
          # status is decided by whether that file was ever written.
          #
          # Only the health endpoint is asserted to answer with a healthy payload; the frontend serves HTML
          # and is only asserted to be reachable, so passing the payload assertion to it would fail a site
          # that is perfectly fine.
          check() {
            local label="$1" url="$2" file="$3" expect="$4" rc
            # Deliberately not `if ! curl ...`: inside the branch `$?` is the status of the negation, so a
            # refusal would be recorded as "curl 0" instead of the code that explains it. `rc` is declared
            # above rather than assigned with `local rc=$?`, because `local` is itself a command whose
            # status would be the one read.
            "${CURL[@]}" "$url" -o "$file"
            rc=$?
            if [ "$rc" != "0" ]; then
              if [ "$rc" = "35" ]; then
                echo "curl 35: a TLS handshake failure, which is how an edge refusing a datacenter IP looks" > verify-body.txt
              else
                echo "curl $rc: could not fetch $url" > verify-body.txt
              fi
              return 1
            fi
            if [ "$expect" = "payload" ] && ! grep -q '"status":"ok"' "$file"; then
              echo "$url did not answer with a healthy payload" > verify-body.txt
              return 1
            fi
            echo "$label"
            return 0
          }

          echo "Checking $BASE/api/health over HTTPS"
          check "Health endpoint is ok" "$BASE/api/health" health.json payload || failed=1

          echo "Checking the frontend at $BASE/"
          if [ -z "$failed" ]; then
            check "Frontend is reachable" "$BASE/" /dev/null reachable || failed=1
          fi

          echo "Checking the plain-HTTP entry point, which nginx redirects to HTTPS"
          if [ -z "$failed" ]; then
            check "HTTP entry point is ok" "${BASE/https:/http:}/api/health" health-http.json payload || failed=1
          fi

          if [ -z "$failed" ]; then
            echo "passed" > verify-status.txt
          else
            echo "failed" > verify-status.txt
            cat verify-body.txt >&2
          fi

          # Always exit 0: whether the runner could reach the site is a result to report, not a failure.
          exit 0

      # Says out loud what the smoke test found. It does not fail the job, but the result is recorded so
      # "the deploy is green" never quietly hides "the site could not be reached from here".
      #
      # It also has to say which of the two it is reporting. The smoke test only ran if the release reached
      # the host, and when it did not - the upload stalled, the migration refused, the API would not start -
      # then there is nothing to report about the site and the reassuring sentence below would be false at
      # exactly the moment a reader most needs the truth.
      - name: Report the smoke test result
        if: always()
        env:
          SITE: ${{ vars.SITE_URL || 'https://kada.click' }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          STATUS=$(cat verify-status.txt 2>/dev/null || echo "failed")
          BODY=$(cat verify-body.txt 2>/dev/null || echo "the smoke test did not run")
          ORIGIN=$(cat verify-origin.txt 2>/dev/null || echo "$SITE")

          if [ "$STATUS" = "passed" ]; then
            echo "$ORIGIN answered over HTTPS, and its API is healthy."
            exit 0
          fi

          if [ "$APPLY_OUTCOME" != "success" ]; then
            {
              echo "### The release did not reach the host"
              echo ""
              echo "The step that applies it ($APPLY_OUTCOME) did not succeed, so no smoke test ran: there was"
              echo "nothing new to check."
              echo ""
              echo "The host is still running the previous build - that step refuses to touch anything until the"
              echo "bundle it was given is complete - so this is a failed deployment, not an outage."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=The release did not reach the host::the apply step did not succeed ($APPLY_OUTCOME); the host still runs the previous build."
            exit 0
          fi

          {
            echo "### Public smoke test did not pass"
            echo ""
            echo "\`$ORIGIN\` could not be reached from the runner, so DNS, TLS or the edge was not verified by this run."
            echo ""
            echo "Reason: $BODY"
            echo ""
            echo "The deployment itself was checked on the host and is not affected."
            echo ""
            echo "A refusal here is usually the host's edge dropping a connection from a datacenter IP;"
            echo "check it from a normal network before treating it as an outage."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Public smoke test did not pass::$ORIGIN was not reachable from the runner. The deployment itself succeeded (checked on the host)."

  # ----- Summary -----
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [go-lint, go-test, web-lint, web-build, deploy]
    if: always()
    steps:
      - name: Report status
        run: |
          {
            echo "## CI Pipeline Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            for job in go-lint go-test web-lint web-build deploy; do
              case "$job" in
                go-lint) result="${{ needs.go-lint.result }}" ;;
                go-test) result="${{ needs.go-test.result }}" ;;
                web-lint) result="${{ needs.web-lint.result }}" ;;
                web-build) result="${{ needs.web-build.result }}" ;;
                deploy) result="${{ needs.deploy.result }}" ;;
              esac
              echo "| $job | $result |"
            done
            echo ""
            echo "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
