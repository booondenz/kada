# Reports how long the certificate the site serves has left, because nothing else does.
#
# The certificate reached a day from expiry before anyone noticed. `certbot.timer` had been failing every
# twelve hours - its authenticator cannot bind port 80, which the nginx container holds - and both TLS
# checks in ci.yml stay green through an expired certificate: the on-host one passes `-k` deliberately,
# and the runner-side one is advisory. See `docs/design.md` section 10.1.
#
# The expiry is read from the HOST over the same SSH connection the deploy job uses, rather than from the
# runner with `openssl s_client`. The runner's view of this site is not trusted (the edge has refused a
# datacenter IP mid-handshake, which is why that smoke test is advisory), and while the domain carries no
# records - as it does during an ICP filing - there is nothing for the runner to connect to at all.
# Reading the file is authoritative either way, and does not care whether the name resolves.
#
# A certificate that is close to expiry does not fail the run: the issue this opens is the durable channel,
# and a scheduled job that stays red for weeks is the alarm people stop reading. A certificate that cannot
# be read does fail it, because that is the check itself being wrong.
#
# GitHub disables a scheduled workflow after 60 days without repository activity, so a repository that goes
# quiet for two months stops being watched - which is the failure this exists to catch, one level up.
# `workflow_dispatch` is here for that, and for verifying a change to the reporting step.

name: Certificate expiry

on:
  schedule:
    # Off the hour on purpose: everything else in this repository runs at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Opening the issue. If a run reports "Resource not accessible by integration", the repository is set to
  # Settings -> Actions -> General -> Workflow permissions -> read-only and refuses this request.
  issues: write

env:
  CERT_PATH: /etc/letsencrypt/live/kada.click/fullchain.pem
  WARN_DAYS: "14"
  EXPIRY_TITLE: The certificate the site serves is close to expiry
  UNREADABLE_TITLE: The certificate check cannot read the certificate

jobs:
  check:
    name: Check the expiry of the served certificate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `gh` works out which repository it is talking about through git, so a job without a checkout fails
      # with "failed to run git: fatal: not a git repository" - which is how the first version of this
      # workflow failed, at 08:40 on 2026-10-14, after it had already read the certificate correctly. The
      # check does not need the files; `gh` needs the repository.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read the certificate from the host
        id: read
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          # The key arrives as a secret, so it is written to a file with the permissions ssh insists on.
          KEY="$RUNNER_TEMP/kada_cert_key"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"

          # LogLevel=ERROR silences the "Permanently added ... to the list of known hosts" notice, which
          # otherwise arrives before anything else and - for a certificate that cannot be read - becomes
          # the reason quoted into the issue.
          SSH=(ssh -i "$KEY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR
               -o UserKnownHostsFile="$RUNNER_TEMP/kada_cert_known_hosts" -o ConnectTimeout=15
               -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          # One round trip, and a protocol rather than exit statuses: what the step needs is the date and
          # whether the certificate is inside the warning window. `-checkend` answers the second without
          # parsing the date, so no date format or timezone assumption is baked in here.
          #
          # `live/` holds symlinks into an archive only root can read, so the read is attempted directly and
          # then with `sudo -n`: whether the deploy user is root or a sudoer, one of the two works.
          remote="p='$CERT_PATH'
          if [ -r \"\$p\" ]; then RUN=\"\"; else RUN=\"sudo -n\"; fi
          if ! \$RUN openssl x509 -enddate -noout -in \"\$p\" 2>/dev/null; then echo 'status=unreadable'; exit 0; fi
          if \$RUN openssl x509 -checkend $((WARN_DAYS * 86400)) -noout -in \"\$p\" >/dev/null 2>&1; then
            echo 'status=ok'
          else
            echo 'status=expiring'
          fi"

          # `|| true`: a refused or dropped connection is a result to report, not a failure to raise here -
          # the next step decides, and it is the one that has to be loud about it.
          out=$("${SSH[@]}" "$SERVER_USER@$SERVER_HOST" "$remote" 2>&1) || true

          status=$(printf '%s\n' "$out" | sed -n 's/^status=//p' | tail -1)
          not_after=$(printf '%s\n' "$out" | sed -n 's/^notAfter=//p' | tail -1)
          reason=$(printf '%s\n' "$out" | head -1)

          if [ -z "$status" ]; then
            status=unreadable
          fi

          # The file is line-based, so each value is one line - hence `reason` being the first line only.
          {
            echo "status=$status"
            echo "not_after=$not_after"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          echo "status=$status"
          echo "not_after=${not_after:-unknown}"

      - name: Report the remaining validity
        env:
          STATUS: ${{ steps.read.outputs.status }}
          NOT_AFTER: ${{ steps.read.outputs.not_after }}
          REASON: ${{ steps.read.outputs.reason }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Every gh call goes through this. `set -e` alone turns a refused API call into "Process completed
          # with exit code 1" and nothing else, and a check that cannot report looks exactly like a check
          # that had nothing to report - which is the failure this workflow exists to prevent, one level up.
          #
          # The message goes to stderr because the callers use this in a command substitution: on stdout it
          # would be captured into the variable it was meant to fill, and the reason would vanish - which is
          # what "The certificate check could not report:" printing nothing looked like the first time.
          gh_or_fail() {
            if ! out=$(gh "$@" 2>&1); then
              echo "::error title=The certificate check could not report::$out" >&2
              exit 1
            fi
            printf '%s\n' "$out"
          }

          # One issue per condition, found by a marker in the body rather than by its title: the title has
          # to stay fixed for a reader, the body carries the date, and a search index lags a new issue.
          # Commenting on the issue that exists is what keeps a daily job from opening a daily issue.
          report() {
            title="$1"; marker="$2"; body="$3"
            expr=".[] | select((.body // \"\") | contains(\"$marker\")) | .number"
            existing=$(gh_or_fail issue list --state open --limit 200 --json number,body --jq "$expr" | head -1)
            if [ -n "$existing" ]; then
              echo "reporting on the open issue #$existing"
              gh_or_fail issue comment "$existing" --body "$body" > /dev/null
            else
              echo "opening an issue"
              gh_or_fail issue create --title "$title" --body "$body" > /dev/null
            fi
          }

          case "$STATUS" in
            ok)
              echo "the certificate is valid for more than $WARN_DAYS days (expires ${NOT_AFTER:-unknown})"
              ;;

            expiring)
              report "$EXPIRY_TITLE" "kada:certificate-expiry" "$(cat <<EOF
          The certificate the site serves is inside its last $WARN_DAYS days.

              $CERT_PATH
              notAfter: ${NOT_AFTER:-unknown}

          Nothing renews it on its own: the authenticator recorded for this lineage is \`standalone\`, which
          cannot bind port 80 because the \`kada-nginx\` container holds it under \`--network host\`. What the
          authenticator should be, why DNS-01 is the only one that works while the domain carries no
          records, and the commands to renew by hand are in \`docs/design.md\` section 10.1.

          A renewed certificate is not served until the container reloads, so a renewal is two steps:

              sudo docker exec kada-nginx nginx -t && sudo docker exec kada-nginx nginx -s reload

          <!-- kada:certificate-expiry -->
          EOF
          )"
              echo "::warning title=The certificate is close to expiry::notAfter ${NOT_AFTER:-unknown}"
              ;;

            *)
              report "$UNREADABLE_TITLE" "kada:certificate-unreadable" "$(cat <<EOF
          The scheduled check cannot read the certificate it exists to watch.

              $REASON

          It reads \`$CERT_PATH\` on the host over SSH. A moved path, a rotated key or a host that is down
          turns this step into something that checks nothing while looking exactly like a check that
          passes, so it fails the run as well as opening this issue.

          <!-- kada:certificate-unreadable -->
          EOF
          )"
              echo "::error title=The certificate check cannot read the certificate::$REASON"
              exit 1
              ;;
          esac
