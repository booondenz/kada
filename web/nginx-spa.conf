# The configuration for the nginx inside the web image (docker compose, local development).
#
# Production does not use this file: there, the host's nginx serves the same directory (see
# deploy/nginx/nginx-prod.conf) and there is no web container at all.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset names make a long cache safe: a new build produces new names.
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /dashboard/links/42 is a route the browser renders, not a file on disk. Anything
    # that is not a file falls back to index.html, or every deep link is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
