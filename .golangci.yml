version: "2"

run:
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gosec
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US
  exclusions:
    # The web app is a separate npm project that happens to live in the same repository, and node_modules
    # holds third-party code - including, in a few packages, .go files of their own. It is not this module's
    # source and must not be linted, whatever a package happens to ship.
    paths:
      - ^web/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
      # Allow ignoring return values of common DB/IO operations
      - linters: [errcheck]
        text: "Scan|Exec|Close|Write|Execute"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/chun/kada-backend
