events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain application/json text/css text/javascript;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name kada.click www.kada.click;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name kada.click www.kada.click;

        ssl_certificate     /etc/letsencrypt/live/kada.click/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kada.click/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security response headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # AI chat streams over SSE: disable buffering and lift timeouts so tokens
        # arrive one by one and an idle answer stream is not cut at the default 60s.
        location /api/ai/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Short-link redirects
        location /r/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Health check
        location /api/health {
            proxy_pass http://127.0.0.1:8080;
        }

        # The web app is a static bundle on disk: there is no Node process to proxy to. A deploy moves a
        # new build into this directory and it is live immediately - nothing to restart.
        #
        # The directory is named for what it serves, not for where it is built: the repository's web/ is
        # what lands here, and the two names are deliberately allowed to differ, because renaming this one
        # means recreating the container that has it bind-mounted.
        #
        # This directory has to be bind-mounted into the nginx container (see the deployment section of
        # docs/design.md). Without the mount, try_files falls through to /index.html, which is not there
        # either, so nginx redirects internally to it, lands in the same location, and gives up with a 500
        # on every page - while the API, behind its own location blocks, keeps answering 200.
        root /opt/kada/frontend;
        index index.html;

        # Content-hashed asset names make a long cache safe: a new build produces new names.
        location /assets/ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Client-side routing: /dashboard/links/42 is rendered by the browser, not read from disk, so
        # anything that is not a file falls back to index.html. Without this every deep link is a 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
