events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain application/json text/css text/javascript;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name kada.click www.kada.click;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name kada.click www.kada.click;

        ssl_certificate     /etc/letsencrypt/live/kada.click/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kada.click/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security response headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Short-link redirects
        location /r/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Uploaded files. `GET /f/<id>` is the address of every file behind a file link, and it is served by
        # the API because the bytes live under UPLOAD_DIR rather than in this bundle. Without this block the
        # request fell through to index.html and answered with the app shell - a 200 that rendered the
        # dashboard instead of a PNG, which is a failure that looks like a working page.
        location /f/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Health check
        location /api/health {
            proxy_pass http://127.0.0.1:8080;
        }

        # The web app is a static bundle on disk: there is no Node process to proxy to. A deploy moves a
        # new build into this directory and it is live immediately - nothing to restart.
        #
        # The directory is named for what it serves, not for where it is built: the repository's web/ is
        # what lands here, and the two names are deliberately allowed to differ, because renaming this one
        # means recreating the container that has it bind-mounted.
        #
        # This directory has to be bind-mounted into the nginx container (see the deployment section of
        # docs/design.md). Without the mount, try_files falls through to /index.html, which is not there
        # either, so nginx redirects internally to it, lands in the same location, and gives up with a 500
        # on every page - while the API, behind its own location blocks, keeps answering 200.
        root /opt/kada/frontend;
        index index.html;

        # Content-hashed asset names make a long cache safe: a new build produces new names.
        location /assets/ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Client-side routing, for the routes the app actually has: /dashboard/links/42 is rendered by the
        # browser, not read from disk. Listed rather than "every path falls back to index.html", because a
        # single-page app that answers 200 with the same empty shell for every unknown path tells a crawler
        # that every URL is a real page - one bad link generator is then an infinite supply of duplicates of
        # the dashboard. A path that is not named here is a 404, which is what it is.
        #
        # `expires -1` rather than `add_header Cache-Control`: a location that sets add_header stops
        # inheriting the server block's, which would drop every security header above from the one response
        # that matters most. This directive does not touch that inheritance. Without it nginx sends only
        # Last-Modified and ETag, which lets a browser apply heuristic freshness (roughly ten percent of the
        # time since the file changed) and quietly hide a deploy behind a cached shell.
        location = / {
            expires -1;
            try_files /index.html =404;
        }

        location ~ ^/(dashboard|privacy|report|login|register|settings)(/|$) {
            expires -1;
            try_files /index.html =404;
        }

        # Everything else is a file in the bundle - the hashed assets, robots.txt, sitemap.xml, the favicon -
        # or it does not exist.
        location / {
            try_files $uri =404;
        }
    }
}
