services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kada
      # Must be overridden via .env in production (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kada123}
      POSTGRES_DB: kada
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kada"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # No host port published: the host already has a local redis on 6379, so this redis is for the API inside the docker network only
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # The API: the Go module is the repository root, so the build context is the root and .dockerignore is
  # what keeps the web app, the documentation and the tool caches out of it.
  api:
    build: .
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://kada:${POSTGRES_PASSWORD:-kada123}@postgres:5432/kada?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: clicks
      # Requires an explicitly provided strong random secret (copy .env.example to .env and fill it in first);
      # the API also rejects weak secrets such as changeme in release mode
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, for example openssl rand -hex 32; do not use changeme}
      # config.Load reads JWT_EXPIRES_IN / API_BASE_URL, so these must stay in sync or the config is silently ignored
      JWT_EXPIRES_IN: 72h
      API_BASE_URL: http://localhost
      PORT: 8080
      # The schema is owned by GORM AutoMigrate (models live in internal/domain/entity). Production normally
      # runs the migration explicitly (cmd/migrate) and starts the API with this disabled, so a restart can
      # never change the database. In Compose the API applies it first.
      DB_AUTO_MIGRATE: "true"
      # The assistant runs in this process, so its key goes to the API rather than to a second service. An
      # empty value still starts the stack: the AI page reports the configuration problem and the rest of
      # the application does not notice.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # "same-origin" keeps requests relative: nginx serves the web app and proxies /api/ to the API.
        # This has to be a build argument, not `environment`, because Vite inlines import.meta.env.VITE_*
        # at build time - a runtime environment variable here would have no effect.
        VITE_API_URL: "same-origin"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports:
      # 9092 is for the docker network (the API and the worker use kafka:9092) and is not published to the host
      # 29092 is for the host (running server/worker locally uses localhost:29092)
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-worker:
    build: .
    command: ["/worker"]
    environment:
      DATABASE_URL: postgres://kada:${POSTGRES_PASSWORD:-kada123}@postgres:5432/kada?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: clicks
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
